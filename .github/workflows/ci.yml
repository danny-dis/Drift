name: ci

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python == '3.12'
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5
        if: matrix.python == '3.13'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package, tests and build tool
        run: python -m pip install -e '.[test]' build
      - name: Build locked production frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
        run: npm ci && npm run build && npm test
      - name: Run complete regression suite (no live inference)
        run: python -m pytest -p no:cacheprovider -q
      - name: Stage credential-free package resources
        run: python -m drift.release_build
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Verify clean wheel install outside checkout
        run: python -m drift.release_build --smoke dist/*.whl --expect-version 0.2.3
