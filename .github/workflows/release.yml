name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require tag, package and frontend versions to match
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          root = pathlib.Path.cwd()
          version = tomllib.loads((root / 'pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag does not match package version'
          assert json.loads((root / 'frontend/package.json').read_text())['version'] == version
          lock = json.loads((root / 'frontend/package-lock.json').read_text())
          assert lock['version'] == lock['packages']['']['version'] == version
          assert (root / f'docs/releases/{version}.md').is_file(), 'Release notes missing'
          PY
      - name: Install package and build tool
        run: python -m pip install -e . build
      - name: Build locked production frontend
        working-directory: frontend
        run: npm ci --include=dev && npm run build
      - name: Stage defaults and build Python artifacts
        run: python -m drift.release_build && python -m build
      - name: Verify clean installed artifact before publishing
        run: python -m drift.release_build --smoke dist/*.whl --expect-version "${GITHUB_REF_NAME#v}"
      - name: Create frontend archive and SHA-256 checksums
        run: python -m drift.release_build --assets dist --expect-version "${GITHUB_REF_NAME#v}"
      - name: Preserve verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Create draft release with every verified asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft \
            --title "Drift ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
      - name: Verify uploaded assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,assets > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json, os, pathlib
          release = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'release.json').read_text())
          expected = {p.name for p in pathlib.Path('dist').iterdir() if p.is_file()}
          assert release['tagName'] == os.environ['GITHUB_REF_NAME']
          assert release['isDraft'], 'Release must remain a draft until all assets are verified'
          assert {asset['name'] for asset in release['assets']} == expected, 'Missing or unexpected assets'
          PY
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,assets > "$RUNNER_TEMP/published-release.json"
          python - <<'PY'
          import json, os, pathlib
          release = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'published-release.json').read_text())
          assert release['tagName'] == os.environ['GITHUB_REF_NAME'] and not release['isDraft']
          expected = {p.name for p in pathlib.Path('dist').iterdir() if p.is_file()}
          assert {asset['name'] for asset in release['assets']} == expected
          PY
