# Drift Configuration
provider: "custom"               # "openai" | "openrouter" | "custom"
model: "auto"                    # DMRX auto-routes to best available
api_key: "dmrx"
base_url: "http://localhost:47113/v1"
ollama_api_key: null

thinking_pace_seconds: 5
max_thoughts_in_context: 4

# Memory stream settings
reflection_threshold: 50
memory_retrieval_count: 3
embedding_model: "text-embedding-3-small"
recency_decay_rate: 0.995
