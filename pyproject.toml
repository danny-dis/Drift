[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift"
version = "0.2.2"
description = "A tiny AI creature that lives in a folder on your computer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "openai>=1.50.0,<3",
    "httpx>=0.27.0,<1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx2>=2.13.1,<3"]

[tool.setuptools.packages.find]
include = ["drift*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
drift = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
